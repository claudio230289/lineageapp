<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Financiero - Claudio (v13.8)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="./manifest.json?v=2">
    <link rel="icon" type="image/svg+xml" href="./icon-finanzas-lineage.svg?v=2">
    <link rel="apple-touch-icon" href="./icon-finanzas-lineage.svg?v=2">
    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media print {
            body { background: white; }
            nav, header button, .no-print { display: none !important; }
            .tab-content { display: block !important; }
        }
    </style>
</head>
<body class="text-gray-800 pb-24">
    <section id="login-panel" class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-100 p-6">
        <div class="w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-xl border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800">Mis Finanzas</h2>
            <p class="mt-2 mb-5 text-sm text-gray-500">Iniciá sesión para continuar</p>
            <button id="login-google-button" type="button" class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white hover:bg-indigo-700">
                Continuar con Google
            </button>
        </div>
    </section>

    <!-- Header Limpio: Dólar y Fecha -->
    <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-base font-bold">Mis Finanzas v13.8</h1>
                <p class="text-[11px] text-indigo-200" id="current-date-label">Cargando fecha...</p>
            </div>
            <div class="flex items-center space-x-2">
                <div onclick="editarDolarManual()" class="bg-indigo-800 px-3 py-1.5 rounded-lg text-right border border-indigo-600 cursor-pointer hover:bg-indigo-900 transition flex items-center space-x-2">
                    <div>
                        <span class="text-[9px] uppercase tracking-wider text-indigo-300 block">Dólar Oficial</span>
                        <span class="text-xs font-bold" id="dolar-oficial-val">$ 1.250</span>
                    </div>
                    <i class="fa-solid fa-pen text-[9px] text-indigo-300"></i>
                </div>
            </div>
        </div>
    </header>
